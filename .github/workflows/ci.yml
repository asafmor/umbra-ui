name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The release flow: the pending changesets produce a version and a changelog, and the package
      # holds what its exports name. It publishes nothing.
      - run: npm run release:check

  # Every story: captures at three sizes, three densities and four tints, the no-page-scroll check,
  # the automated accessibility check and the interaction tests. Split so it stays fast as stories grow.
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook -- --quiet
      - run: npx playwright test --shard=${{ matrix.shard }}/6
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  # The three example apps, each installed in its own folder against the built package (this checks the
  # published entries and types) and driven in a browser: they load cleanly, never scroll the page at
  # any size or density, switch to tabs, and their interactions work.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:examples
      # Each example, copied out of the repository and installed against the packed tarball.
      - run: npm run examples:standalone
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-examples
          path: test-results
          retention-days: 7
